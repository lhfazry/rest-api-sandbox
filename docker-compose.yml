# Coolify-ready stack for the Mock Supplier API.
#
# Coolify: New Resource -> Docker Compose (from Git) -> repo ini.
# Penting: app listen di port 4010, BUKAN 80. Domain harus diarahkan ke 4010,
# kalau tidak Traefik akan menjawab 503 "no available server".

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            PORT: "4010"
            NODE_ENV: production
            # Mutasi (POST/PUT/PATCH/DELETE) disimpan ke volume app_data sehingga
            # data tetap ada setelah container restart/redeploy.
            PERSIST_DATA: ${PERSIST_DATA}
            # Magic Coolify variable: deklarasi ini membuat Coolify memasang route
            # domain -> port 4010 secara otomatis (service "app" -> APP).
            # Domain hasil generate bisa diganti di UI menjadi rest-api.rumahcoding.id.
            SERVICE_FQDN_APP_4010:
        # Publikasikan port seperti project Astro yang sudah jalan. Berguna untuk
        # cek langsung: curl http://<ip-server>:4010/health
        volumes:
            # Named volume: seed JSON + state.json (hasil POST/PUT/PATCH/DELETE).
            # Jangan dihapus kalau data ingin tetap ada setelah redeploy.
            # Hapus volume (Coolify UI -> Persistent Storage, atau
            # `docker compose down -v`) untuk reset data ke file seed.
            - app_data:/app/data
        ports:
            - "4010:4010"
        expose:
            - "4010"
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 512M
                reservations:
                    cpus: "0.25"
                    memory: 128M
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:'+(process.env.PORT||4010)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        restart: always

volumes:
    app_data:
